name: Restore drill

# 每月的還原演練（#28）：取最新一次成功的 Database backup，在拋棄式 Postgres 上解密、還原、
# 逐表比對筆數，並確認備份沒有中斷（最新備份不超過 max_age_hours）。不會連到正式或 Staging。
# 結果寫在這次執行的 Summary；人工演練的紀錄格式見 docs/RESTORE_RUNBOOK.md。
#
# 需要的 repo secret：BACKUP_ENCRYPTION_PASSPHRASE
on:
  schedule:
    # 每月 1 日 UTC 03:40（台灣 11:40）
    - cron: '40 3 1 * *'
  workflow_dispatch:
    inputs:
      max_age_hours:
        description: '最新備份最多可以是幾小時前（每 6 小時備份一次，預設 7）'
        required: false
        default: '7'

permissions:
  contents: read
  actions: read

jobs:
  drill:
    name: 還原最新備份並驗證
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: 安裝 PostgreSQL 17 client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-common gnupg
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-17
          echo /usr/lib/postgresql/17/bin >> "$GITHUB_PATH"

      - name: 找最新一次成功的備份，確認沒有中斷
        id: latest
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          MAX_AGE_HOURS: ${{ inputs.max_age_hours || '7' }}
        run: |
          json="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow db-backup.yml --status success \
                    --limit 1 --json databaseId,createdAt)"
          id="$(echo "$json" | python3 -c 'import json,sys; r=json.load(sys.stdin); print(r[0]["databaseId"] if r else "")')"
          [ -n "$id" ] || { echo '::error::找不到任何成功的資料庫備份'; exit 1; }
          age_h="$(echo "$json" | python3 -c '
          import json, sys, datetime
          t = datetime.datetime.fromisoformat(json.load(sys.stdin)[0]["createdAt"].replace("Z", "+00:00"))
          print(int((datetime.datetime.now(datetime.timezone.utc) - t).total_seconds() // 3600))')"
          echo "最新備份：run $id，$age_h 小時前" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$age_h" -gt "$MAX_AGE_HOURS" ]; then
            echo "::error::最新的成功備份是 $age_h 小時前，超過 $MAX_AGE_HOURS 小時：定時備份可能中斷了"
            exit 1
          fi
          echo "id=$id" >> "$GITHUB_OUTPUT"

      - name: 下載備份
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "${{ steps.latest.outputs.id }}" --repo "$GITHUB_REPOSITORY" -n "db-backup-${{ steps.latest.outputs.id }}" -D backup

      - name: 解密、還原、逐表比對
        shell: bash
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_ENCRYPTION_PASSPHRASE }}
          RESTORE_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/postgres
        run: |
          [ -n "$BACKUP_PASSPHRASE" ] || { echo '::error::沒有設定 BACKUP_ENCRYPTION_PASSPHRASE'; exit 1; }
          bash tools/db-restore-verify.sh backup | tee -a "$GITHUB_STEP_SUMMARY"
