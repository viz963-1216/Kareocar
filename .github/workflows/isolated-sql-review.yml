name: Isolated SQL and reset checks

# 在一個用完就丟的 postgres:16 容器上，用 supabase/migrations/ 的實際 migration
# 建庫，跑 seed 情境測試與密碼重設的交易／併發測試。
# 全部使用合成資料，不連正式資料庫、不呼叫任何外部服務。

# push 到 main 是「合併後檢查」：確認進到 main 的內容自己跑得過，不是只在 PR
# 的合併預覽上跑得過。
#
# 它擋不住任何東西。GitHub Actions 與 Netlify 是兩個獨立的觸發來源，同一個
# push 會同時啟動；這個 workflow 失敗不會阻止、也不會回復 Netlify 已經開始
# 或完成的自動部署。要真正把部署擋在檢查之後，得靠 Netlify 端的設定
# （關閉 auto-publish，或用 branch deploy／deploy preview 流程）。
on:
  pull_request:
    paths:
      - 'supabase/**'
      - 'netlify/functions/**'
      - 'tests/**'
      - 'tools/**'
      - 'index.html'
      - 'js/**'
      - '_headers'
      - 'netlify.toml'
      - 'package.json'
      - '.github/workflows/isolated-sql-review.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/**'
      - 'netlify/functions/**'
      - 'tests/**'
      - 'tools/**'
      - 'index.html'
      - 'js/**'
      - '_headers'
      - 'netlify.toml'
      - 'package.json'
      - '.github/workflows/isolated-sql-review.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres:
    # Netlify 的建置與 function runtime 設定為 Node 24.x，所以 24 是真正要保證
    # 的版本；package.json 的 engines 是 >=20，所以 20 一起跑，避免只在單一版本
    # 上綠燈。兩個版本跑的是同一套測試。
    name: postgres (node ${{ matrix.node }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        node: ['20', '24']

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        # 走 TCP 而不是掛載 Unix socket 目錄：socket 的權限在 runner 上容易壞，
        # 而測試腳本本來就吃 PG* 環境變數。
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      - name: 記錄實際 Node 版本
        run: node --version

      - name: 安裝 psql 與測試相依
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          npm install --ignore-scripts --no-audit --no-fund

      - name: 確認資料庫連得上
        run: psql -X -v ON_ERROR_STOP=1 -c 'select version()'

      - name: 離線回歸測試（純 Node）
        run: bash tests/run.sh

      - name: 實際 migration + seed 情境 + 連線 TLS 判斷
        run: bash supabase/tests/run-isolated-review.sh

      # 斷言預期業務行為（接案、司機執行、需求者取消）。放在獨立一步，前面各步
      # 的結果仍可單獨判讀。
      - name: 業務權限整合測試（接案／司機執行／需求者取消 + RLS）
        run: bash supabase/tests/run-business-flow.sh

      - name: 機構申請與審核整合測試（申請、審核權限、需求池與接案開關、稽核）
        run: bash supabase/tests/run-org-review.sh

      - name: 預約伺服器計算欄位整合測試（定位、模糊地址、報價待定價、地址找不到、需求池不露個資）
        run: bash supabase/tests/run-booking-geo.sh

      - name: 預約與行程寫入、存取撤銷整合測試（狀態規則、退回／不受理／取消後原機構讀不到、跨機構司機／車輛／預約、需求者只看到承接單位名稱）
        run: bash supabase/tests/run-booking-access.sh

      - name: 排車 command 整合測試（預約與行程一筆交易、部分失敗全部不寫入、版本衝突、來回、共乘與排車建議）
        run: bash supabase/tests/run-schedule-trips.sh

      - name: 通知整合測試（承接、排車、指派、改派、完成各自通知正確收件人；收件人只讀得到自己的）
        run: bash supabase/tests/run-notifications.sh

      - name: 補助整合測試（規則版本、伺服器試算與預約估算、正式核定、保留／釋放／結算、併發不超額）
        run: bash supabase/tests/run-benefit.sh

      - name: 同意紀錄、保存期限匿名化與刪除申請整合測試（條款改版要求重新同意、到期資料匿名化、刪除申請狀態與執行、稽核）
        run: bash supabase/tests/run-privacy.sh

      - name: Google、Facebook 登入整合測試（PKCE、偽造／重放的回呼、綁定前不能使用、綁定既有帳號要密碼、同一社群帳號不能綁兩人、解除綁定）
        run: bash supabase/tests/run-oauth.sh

      - name: 福利規則排程抓取整合測試（抓取紀錄、內容沒變不產生草稿、差異、核准取代、失敗告警且現行版本不變）
        run: bash supabase/tests/run-benefit-fetch.sh

      - name: 身分、session、帳號與 RLS 測試（run-all：session／identity／orgs／identity-write／state／load／wiring／rls）
        run: bash supabase/tests/run-all.sh

      - name: migration 往返（回復檔齊全、上→下→上、司機政策執行計畫、通知觸發器）
        run: bash supabase/tests/migrations.test.sh

      - name: migration 執行器（紀錄、checksum、順序、舊庫拒絕、回滾、lock_timeout）
        run: bash supabase/tests/apply-migrations.test.sh

      - name: 舊正式庫清空腳本（模擬手動建立的庫 → 清空 → 從頭套用；auth 與擴充套件不受影響；已有紀錄的庫拒絕）
        run: bash supabase/tests/reset-legacy.test.sh

      - name: 備份與還原演練腳本（加密、筆數清單、還原比對；密碼錯、檔案被改、筆數不符、目標非空都失敗）
        run: bash supabase/tests/backup-restore.test.sh

      - name: 效能量測（#125：預約與行程搬表前的基準；只記錄，不因數字失敗）
        run: bash supabase/tests/run-perf.sh
        env:
          PERF_OUT: ${{ runner.temp }}/perf/results-node${{ matrix.node }}.json

      - name: 保存效能量測結果
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: perf-results-node${{ matrix.node }}
          path: ${{ runner.temp }}/perf
          retention-days: 30

  browser-e2e:
    # 在真的 Chrome 裡操作 index.html：調度接案、司機執行（含離線／返回／服務
    # 證明照片）、需求者取消與通知。Chrome 是 runner 映像內建的，不另外安裝；
    # 瀏覽器控制只用 DevTools Protocol 與 Node 24 內建的 WebSocket。
    name: 瀏覽器端對端 (node 24)
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: 安裝 psql 與測試相依
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          npm install --ignore-scripts --no-audit --no-fund

      - name: 記錄 Chrome 版本
        run: google-chrome --version

      - name: 瀏覽器端對端測試
        run: bash supabase/tests/run-browser-e2e.sh
        env:
          E2E_ARTIFACT_DIR: ${{ runner.temp }}/care-ride-e2e-artifacts

      - name: 保存瀏覽器驗收證據
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-e2e-evidence
          path: ${{ runner.temp }}/care-ride-e2e-artifacts
          retention-days: 7
