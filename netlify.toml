[build]
  publish = "."
  functions = "netlify/functions"

[[redirects]]
  from = "/api/runtime-config"
  to = "/.netlify/functions/runtime-config"
  status = 200

[[redirects]]
  from = "/api/google-auth"
  to = "/.netlify/functions/google-auth"
  status = 200

[[redirects]]
  from = "/api/google-db"
  to = "/.netlify/functions/google-db"
  status = 200

[[redirects]]
  from = "/api/identity/register-requester"
  to = "/.netlify/functions/identity-register-requester"
  status = 200

[[redirects]]
  from = "/api/identity/password-login"
  to = "/.netlify/functions/identity-password-login"
  status = 200

[[redirects]]
  from = "/api/identity/create-staff"
  to = "/.netlify/functions/identity-create-staff"
