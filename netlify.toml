[build]
  publish = "."
  functions = "netlify/functions"

[[redirects]]
  from = "/api/runtime-config"
  to = "/.netlify/functions/runtime-config"
  status = 200

[[redirects]]
  from = "/api/google-auth"
  to = "/.netlify/functions/google-auth"
  status = 200

[[redirects]]
  from = "/api/identity/complete-social-profile"
  to = "/.netlify/functions/identity-complete-social-profile"
  status = 200

[[redirects]]
  from = "/api/health"
  to = "/.netlify/functions/health"
  status = 200

[[redirects]]
  from = "/api/v2/password-login"
  to = "/.netlify/functions/v2-password-login"
  status = 200

[[redirects]]
  from = "/api/v2/bootstrap-admin"
  to = "/.netlify/functions/v2-bootstrap-admin"
  status = 200

[[redirects]]
  from = "/api/v2/session"
  to = "/.netlify/functions/v2-session"
  status = 200

[[redirects]]
  from = "/api/v2/register-requester"
  to = "/.netlify/functions/v2-register-requester"
  status = 200

[[redirects]]
  from = "/api/v2/request-password-reset"
  to = "/.netlify/functions/v2-request-password-reset"
  status = 200

[[redirects]]
  from = "/api/v2/confirm-password-reset"
  to = "/.netlify/functions/v2-confirm-password-reset"
  status = 200

[[redirects]]
  from = "/api/v2/create-staff"
  to = "/.netlify/functions/v2-create-staff"
  status = 200

[[redirects]]
  from = "/api/v2/update-account"
  to = "/.netlify/functions/v2-update-account"
  status = 200

[[redirects]]
  from = "/api/v2/state-mutate"
  to = "/.netlify/functions/v2-state-mutate"
  status = 200

[[redirects]]
  from = "/api/v2/state-load"
  to = "/.netlify/functions/v2-state-load"
  status = 200
